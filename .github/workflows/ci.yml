name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Erlang/OTP and rebar3
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          rebar3-version: "3.27"

      - name: Compile
        run: make compile

      - name: Tests
        run: make tests

      - name: Dialyzer
        run: make dialyzer
